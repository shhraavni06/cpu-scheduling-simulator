---
- name: Install Java runtime
  ansible.builtin.apt:
    name: "{{ java_package }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create application user
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true
    shell: /usr/sbin/nologin

- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    mode: "0755"

- name: Copy application JAR
  ansible.builtin.copy:
    src: "{{ jar_src }}"
    dest: "{{ app_dir }}/{{ app_name }}.jar"
    owner: "{{ app_user }}"
    mode: "0644"
  notify: Restart application

- name: Install systemd service (port comes from the app_port variable)
  ansible.builtin.template:
    src: cpu-scheduler.service.j2
    dest: "/etc/systemd/system/{{ app_name }}.service"
    mode: "0644"
  notify:
    - Reload systemd
    - Restart application

- name: Flush handlers so the service definition is loaded before starting
  ansible.builtin.meta: flush_handlers

- name: Enable and start the application
  ansible.builtin.systemd:
    name: "{{ app_name }}"
    enabled: true
    state: started

- name: Verify the application answers on /health
  ansible.builtin.uri:
    url: "http://localhost:{{ app_port }}/health"
    status_code: 200
  register: health
  retries: 12
  delay: 5
  until: health.status == 200
